{{ define "main" }}
<div class="container">
  <article class="post error-page">
    <h1>{{ .Title }}</h1>
    <div class="post-content">
      {{ .Content }}
    </div>
    {{ partial "pagefind.html" . }}
  </article>
</div>
<script>
  const words = window.location.pathname
    .split("/")
    .filter(Boolean)
    .join(" ")
    .replace(/[-_]+/g, " ")
    .trim();
  if (words) ui.triggerSearch(words);
</script>
{{ end }}
